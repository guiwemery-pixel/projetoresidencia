<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulso do Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de cartões (até 1120px), abas fixas no alto e um herói escuro abrindo cada análise, como na apresentação do treino */
:root {
  --bg: #F2EEE6; --surface: #FBF9F4; --surface-2: #EFEAE0; --ink: #14181F; --ink-2: #474C55; --muted: #676C75;
  --line: #DDD6C8; --grid: #E7E1D5; --axis: #C9C2B3;
  --accent: #F28C4A; --accent-ink: #B9470F; --accent-soft: rgba(242,140,74,.14); --on-accent: #14181F;
  --hero: #14181F; --hero-2: #252C38; --hero-ink: #F2EEE6; --hero-muted: #B4BBC6;
  --z0: #C9C3B6; --z1: #E0A25E; --z2: #DA8142; --z3: #C9612A; --z4: #A8461C; --z5: #7E2D12;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --good: #1C7C3A; --bad: #B3261E;
  --display: 'Oswald', 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif;
  --sans: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1217; --surface: #171C23; --surface-2: #1E242D; --ink: #F2EEE6; --ink-2: #C3C8D0; --muted: #959BA5;
    --line: #2A313C; --grid: #232A34; --axis: #3A424E;
    --accent: #F28C4A; --accent-ink: #F5A673; --accent-soft: rgba(242,140,74,.16); --on-accent: #14181F;
    --hero: #1B212A; --hero-2: #2A3240; --hero-ink: #F2EEE6; --hero-muted: #B4BBC6;
    --z0: #4A515C; --z1: #F2B582; --z2: #EE9255; --z3: #E1702F; --z4: #BE5020; --z5: #A23C16;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --good: #4CC27A; --bad: #F2766B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1217; --surface: #171C23; --surface-2: #1E242D; --ink: #F2EEE6; --ink-2: #C3C8D0; --muted: #959BA5;
  --line: #2A313C; --grid: #232A34; --axis: #3A424E;
  --accent: #F28C4A; --accent-ink: #F5A673; --accent-soft: rgba(242,140,74,.16); --on-accent: #14181F;
  --hero: #1B212A; --hero-2: #2A3240; --hero-ink: #F2EEE6; --hero-muted: #B4BBC6;
  --z0: #4A515C; --z1: #F2B582; --z2: #EE9255; --z3: #E1702F; --z4: #BE5020; --z5: #A23C16;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  --good: #4CC27A; --bad: #F2766B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.app { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; display: flex; flex-direction: column; gap: 16px; }

/* topo e abas */
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.marca { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: .5px; text-transform: uppercase; }
.marca svg { width: 30px; height: 30px; flex: none; }
.topo-acoes { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.selo { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.selo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.selo[data-tipo="local"]::before { background: var(--accent); }
.selo[data-tipo="memoria"]::before, .selo[data-tipo="carregando"]::before { background: var(--muted); }
.abas { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; overflow-x: auto; scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.aba { flex: 1 0 auto; border: 0; background: transparent; padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.aba[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.aba:focus-visible, .btn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .svg-graf:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vista { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.vista.carregando { opacity: .55; transition: opacity .2s; }

/* botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--axis); }
.btn-acento { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-acento:hover { filter: brightness(1.05); border-color: var(--accent); }
.btn-escuro { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn-perigo { color: var(--bad); }
.btn-perigo-cheio { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.oculto-visual { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
input[type="number"], input[type="text"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 84px; }
select { cursor: pointer; }
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo > span { font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
.form-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.botoes { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

/* cartões */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-topo > div:first-child { min-width: 0; }
.sobretitulo { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-ink); }
h2 { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.15; }
h3 { font-size: 15px; font-weight: 700; }
.nota { font-size: 13px; color: var(--muted); }
.texto { color: var(--ink-2); max-width: 70ch; }
.controles { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.controles select { padding: 6px 8px; font-size: 13.5px; }
.grade-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.alternar { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface-2); }
.alternar button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.alternar button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

/* herói */
.seletor { display: flex; gap: 8px; align-items: center; }
.seletor select { flex: 1; min-width: 0; font-weight: 600; }
.seletor .btn { padding: 8px 12px; }
.heroi { position: relative; overflow: hidden; background: var(--hero); color: var(--hero-ink); border-radius: 18px; padding: 28px 24px 30px; min-height: 260px; display: flex; flex-direction: column; justify-content: flex-start; gap: 10px; }
.heroi-curva { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 58%; pointer-events: none; }
.heroi > *:not(.heroi-curva) { position: relative; }
.heroi .sobretitulo { color: var(--accent); }
.heroi h1 { font-family: var(--display); font-weight: 700; font-size: clamp(40px, 9vw, 84px); line-height: 1; text-transform: uppercase; letter-spacing: .5px; margin-top: 14px; overflow-wrap: anywhere; }
.heroi-sub { font-size: 17px; color: var(--hero-muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { background: var(--hero-2); color: var(--hero-ink); padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.chip-acento { background: var(--accent); color: var(--on-accent); }

/* números */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi-rot { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.kpi-valor { font-family: var(--display); font-weight: 600; font-size: 44px; line-height: 1.05; margin-top: 4px; }
.kpi-un { font-size: 15px; font-weight: 700; color: var(--accent-ink); }
.kpi-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.kpi-escuro { background: var(--hero); border-color: var(--hero); color: var(--hero-ink); }
.kpi-escuro .kpi-rot, .kpi-escuro .kpi-sub { color: var(--hero-muted); }
.kpi-escuro .kpi-un { color: var(--accent); }
.destaques { border-left: 6px solid var(--accent); padding: 4px 0 4px 18px; display: flex; flex-direction: column; gap: 8px; }
.destaques p { font-size: 16px; color: var(--ink); max-width: 75ch; }

/* avisos */
.aviso { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 16px; font-size: 14px; }
.aviso p { max-width: 75ch; }
.vazio { text-align: left; align-items: flex-start; }

/* gráficos */
.graf { position: relative; width: 100%; min-width: 0; }
.svg-graf { display: block; max-width: 100%; touch-action: pan-y; }
.t-eixo { fill: var(--muted); font: 12px var(--sans); font-variant-numeric: tabular-nums; }
.t-bloco { fill: var(--accent-ink); font: 700 11px var(--sans); }
.t-marca { fill: var(--ink); font: 700 12px var(--sans); }
.l-grade { stroke: var(--grid); stroke-width: 1; }
.l-base { stroke: var(--axis); stroke-width: 1; }
.l-cursor { stroke: var(--ink-2); stroke-width: 1; }
.l-marca { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.r-bloco { fill: var(--accent); opacity: .13; }
.r-alvo { fill: transparent; cursor: crosshair; }
.r-coluna { fill: transparent; cursor: pointer; }
.r-coluna:hover { fill: var(--ink); fill-opacity: .05; }
.dica-graf, #dica { position: absolute; z-index: 8; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.14); min-width: 120px; max-width: 260px; }
#dica { position: fixed; white-space: pre-line; }
.dica-tit { font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.dica-lin { display: flex; align-items: center; gap: 8px; }
.dica-lin i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.dica-lin b { font-variant-numeric: tabular-nums; }
.dica-lin span { color: var(--muted); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.legenda i.lk { height: 3px; width: 16px; border-radius: 2px; }

/* zonas (barras horizontais) */
.zonas-lista { display: flex; flex-direction: column; gap: 10px; }
.zl { display: grid; grid-template-columns: minmax(110px, 160px) 1fr auto; align-items: center; gap: 12px; }
.zl-rot { font-weight: 600; font-size: 14px; line-height: 1.25; }
.zl-rot small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.zl-trilho { height: 26px; min-width: 0; }
.zl-barra { height: 100%; border-radius: 0 6px 6px 0; min-width: 2px; }
.zl-val { font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.zl-val b { font-weight: 700; }

/* barras empilhadas (histórico e comparação) */
.pilhas { display: flex; flex-direction: column; gap: 10px; }
.pl { display: grid; grid-template-columns: minmax(96px, 150px) 1fr auto; gap: 12px; align-items: center; }
.pl-rot { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font-size: 13.5px; font-weight: 600; line-height: 1.25; min-width: 0; display: flex; gap: 8px; align-items: flex-start; }
.pl-rot small { display: block; font-weight: 400; color: var(--muted); }
.pl-rot i { width: 12px; height: 12px; border-radius: 3px; flex: none; margin-top: 3px; }
.pl-rot:hover span { text-decoration: underline; }
.pilha { display: flex; gap: 2px; height: 22px; min-width: 0; }
.pilha .seg { min-width: 2px; height: 100%; }
.pilha .seg:last-child { border-radius: 0 5px 5px 0; }
.pilha .seg:hover { filter: brightness(1.12); }
.pl-val { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink-2); }

/* tabelas */
.rolagem { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; }
.tabela { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tabela th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tabela td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.tabela tbody tr:nth-child(even) td { background: var(--surface-2); }
.tabela .num { text-align: right; white-space: nowrap; }
.tabela .dif { display: block; font-size: 12px; color: var(--muted); }
.tabela th .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.dl { display: grid; grid-template-columns: minmax(130px, 220px) 1fr; gap: 8px 16px; font-size: 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
details > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
details[open] > summary { margin-bottom: 10px; }

/* recuperação */
.recup { background: var(--accent); color: var(--on-accent); border: 0; }
.recup .sobretitulo { color: var(--on-accent); }
.recup .recup-num { font-family: var(--display); font-weight: 700; font-size: clamp(56px, 12vw, 104px); line-height: 1; }
.recup p { font-size: 17px; font-weight: 600; max-width: 60ch; }
.recup .recup-num { max-width: none; }
.recup .nota { color: var(--on-accent); opacity: .85; font-weight: 400; }

/* histórico */
.lista-treinos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lt { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--grid); }
.lt:last-child { border-bottom: 0; }
.lt input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.lt-abrir { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 220px); gap: 4px 16px; align-items: center; }
.lt-abrir:hover .lt-tipo { text-decoration: underline; }
.lt-tipo { font-weight: 700; }
.lt-data { color: var(--muted); font-size: 13px; font-weight: 400; margin-left: 6px; }
.lt-metr { grid-column: 1; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lt .pilha { grid-column: 2; grid-row: 1 / span 2; height: 14px; }
.barra-comparar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.escolha { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
.escolha label { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--grid); cursor: pointer; font-size: 14px; }
.escolha label:last-child { border-bottom: 0; }
.escolha input { accent-color: var(--accent); width: 17px; height: 17px; flex: none; }
.escolha i { width: 12px; height: 12px; border-radius: 3px; flex: none; background: transparent; border: 1px dashed var(--axis); }
.escolha small { color: var(--muted); margin-left: auto; text-align: right; white-space: nowrap; }

/* zonas (config) */
.tz input { width: 82px; }
.tz td { vertical-align: middle; }
.sw-z { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
.metodo { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px; display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0; }
.metodo legend { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); padding: 0 6px; }
.metodo label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: 14px; }
.metodo input { accent-color: var(--accent); }
.refs { font-size: 12.5px; color: var(--muted); padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.confirmar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }

/* avisos flutuantes */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-size: 14px; max-width: min(92vw, 560px); box-shadow: 0 8px 28px rgba(0,0,0,.25); white-space: pre-line; }
.soltar { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(20,24,31,.72); color: #F2EEE6; font-family: var(--display); font-size: clamp(26px, 5vw, 44px); text-transform: uppercase; letter-spacing: 1px; padding: 24px; text-align: center; }
.soltar span { border: 3px dashed var(--accent); border-radius: 24px; padding: 40px 32px; }

@media (max-width: 560px) {
  .card { padding: 16px; }
  .heroi { padding: 22px 18px 26px; min-height: 230px; }
  .zl { grid-template-columns: 96px 1fr; }
  .zl-val { grid-column: 2; text-align: left; margin-top: -6px; }
  .pl { grid-template-columns: 1fr auto; }
  .pl .pilha { grid-column: 1 / -1; grid-row: 2; }
  .lt-abrir { grid-template-columns: 1fr; }
  .lt .pilha { grid-column: 1; grid-row: auto; }
  .dl { grid-template-columns: 1fr; gap: 2px; }
  .dl dd { margin-bottom: 8px; }
  .kpi-valor { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="marca">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" style="fill:var(--ink)"/><path d="M4 18h6l3-8 4 13 3-9 2 4h6" style="fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/></svg>
      <span>Pulso do Treino</span>
    </div>
    <div class="topo-acoes">
      <span id="selo" class="selo" data-tipo="carregando">Carregando…</span>
      <label class="btn btn-acento" for="arquivo">Importar treino</label>
      <input id="arquivo" class="oculto-visual" type="file" multiple>
    </div>
  </header>
  <nav class="abas" role="tablist" aria-label="Seções">
    <button class="aba" role="tab" id="t-treino" data-aba="treino" aria-selected="true" aria-controls="aba-treino">Treino</button>

<script>
'use strict';

// ================= utilidades =================
const $ = (s, el = document) => el.querySelector(s);

const fmtData = (ms, fuso) => { const d = parede(ms, fuso); return `${p2(d.getUTCDate())} ${MESES[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };

// ================= leitura dos arquivos =================
function detectarFormato(buf) {
  const u8 = new Uint8Array(buf);
  if (u8.length >= 12 && String.fromCharCode(u8[8], u8[9], u8[10], u8[11]) === '.FIT') return 'FIT';
  const cab = new TextDecoder('utf-8').decode(u8.subarray(0, 4096)).replace(/^﻿/, '').trimStart();
  if (cab.startsWith('<')) {
    if (/<TrainingCenterDatabase/i.test(cab)) return 'TCX';
    if (/<gpx[\s>]/i.test(cab)) return 'GPX';

}

const filhos = (el, nome) => [...el.children].filter(c => c.localName === nome);
const filho = (el, nome) => { if (!el) return null; for (const c of el.children) if (c.localName === nome) return c; return null; };

function lerXML(txt) {
  const doc = new DOMParser().parseFromString(txt, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('o arquivo está corrompido ou incompleto');
  return doc;
}

  const m = /([+-])(\d\d):?(\d\d)$/.exec(String(txt || '').trim());
  return m ? (m[1] === '-' ? -1 : 1) * (+m[2] * 60 + +m[3]) : null;
}

function parseTCX(txt) {
  const doc = lerXML(txt);
  const atividades = [...doc.getElementsByTagNameNS('*', 'Activity')];
  const saida = [];
  for (const act of atividades) {
    const criador = filho(act, 'Creator');
    let dispositivo = null;
    if (criador) {
      const ver = filho(criador, 'Version');
      const versao = ver ? [texto(ver, 'VersionMajor'), texto(ver, 'VersionMinor')].filter(v => v != null).join('.') : null;
      dispositivo = { nome: texto(criador, 'Name'), versao: versao || null, produto: texto(criador, 'ProductID'), unidade: texto(criador, 'UnitId') };
    }

    let primeiroTempo = null;

      const v = {
        inicioTxt: lap.getAttribute('StartTime'), tempoS: numero(lap, 'TotalTimeSeconds'), distanciaM: numero(lap, 'DistanceMeters'),
        velMax: numero(lap, 'MaximumSpeed'), calorias: numero(lap, 'Calories'), fcMed: valorDe(lap, 'AverageHeartRateBpm'),
        fcMax: valorDe(lap, 'MaximumHeartRateBpm'), intensidade: texto(lap, 'Intensity'), cadencia: numero(lap, 'Cadence'),
        gatilho: texto(lap, 'TriggerMethod'), notas: texto(lap, 'Notes'), extras: {}

        if (!isFinite(ms)) continue;
        if (!primeiroTempo) primeiroTempo = tt;
        const p = { ms };
        const fc = valorDe(tp, 'HeartRateBpm'); if (fc != null) p.fc = fc;
        const pos = filho(tp, 'Position'); if (pos) { p.lat = numero(pos, 'LatitudeDegrees'); p.lon = numero(pos, 'LongitudeDegrees'); }

        const dist = numero(tp, 'DistanceMeters'); if (dist != null) p.dist = dist;
        const cad = numero(tp, 'Cadence'); if (cad != null) p.cad = cad;
        const e = filho(tp, 'Extensions');

}

function parseGPX(txt) {
  const doc = lerXML(txt);
  const raiz = doc.documentElement;
  const trk = doc.getElementsByTagNameNS('*', 'trk')[0];
  const pontos = [];
  let primeiroTempo = null;
  for (const pt of doc.getElementsByTagNameNS('*', 'trkpt')) {
    const tt = texto(pt, 'time'); const ms = Date.parse(tt);
    if (!isFinite(ms)) continue;
    if (!primeiroTempo) primeiroTempo = tt;
    const p = { ms, lat: parseFloat(pt.getAttribute('lat')), lon: parseFloat(pt.getAttribute('lon')) };
    const ele = numero(pt, 'ele'); if (ele != null) p.alt = ele;
    const ext = filho(pt, 'extensions');
    if (ext) for (const el of ext.getElementsByTagName('*')) {
      if (el.children.length) continue;
      const n = parseFloat(el.textContent); if (!isFinite(n)) continue;
      const k = el.localName.toLowerCase();
      if (k === 'hr' || k === 'heartrate') p.fc = n; else if (k === 'cad' || k === 'cadence') p.cad = n;
      else if (k === 'power' || k === 'powerinwatts') p.pot = n; else if (k === 'speed') p.vel = n; else if (k === 'atemp' || k === 'temp') p.temp = n;

}

// FIT (Garmin, Coros, Polar, Wahoo…): leitura binária das mensagens de registro, volta e sessão
const FIT_ESPORTES = { 1: 'Corrida', 2: 'Ciclismo', 5: 'Natação', 11: 'Caminhada', 15: 'Remo', 17: 'Trilha' };

      case 12: { if (tam < 4) return null; const v = dv.getUint32(o, le); return v === 0 ? null : v; }

    } else if (g === 19) {
      voltas.push({ inicioMs: m[2] != null ? (m[2] + EPOCA) * 1000 : null, tempoS: div(m[7], 1000), tempoAtivoS: div(m[8], 1000), distanciaM: div(m[9], 100), calorias: m[11], velMed: div(m[13], 1000), velMax: div(m[14], 1000), fcMed: m[15], fcMax: m[16], cadencia: m[17], potMed: m[19], subidaM: m[21], descidaM: m[22], extras: {} });
    } else if (g === 18 && !sessao) {
      sessao = { esporte: m[5], tempoS: div(m[7], 1000), tempoAtivoS: div(m[8], 1000), distanciaM: div(m[9], 100), calorias: m[11], velMed: div(m[14], 1000), velMax: div(m[15], 1000), fcMed: m[16], fcMax: m[17], cadMed: m[18], potMed: m[20], subidaM: m[22], descidaM: m[23] };

    }

  const totais = sessao ? { tempoS: sessao.tempoS, tempoAtivoS: sessao.tempoAtivoS, distanciaM: sessao.distanciaM, calorias: sessao.calorias, fcMed: sessao.fcMed, fcMax: sessao.fcMax, velMed: sessao.velMed, velMax: sessao.velMax, cadMed: sessao.cadMed, potMed: sessao.potMed, subidaM: sessao.subidaM, descidaM: sessao.descidaM } : null;

function dividirCSV(linha, sep) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < linha.length; i++) {
    const ch = linha[i];
    if (q) { if (ch === '"') { if (linha[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === sep) { out.push(cur.trim()); cur = ''; } else cur += ch;
  }
  out.push(cur.trim());
  return out;
}
function parseCSV(txt, arquivo) {
  const linhas = txt.replace(/^﻿/, '').split(/\r?\n/);
  const sepDe = l => { const pv = (l.match(/;/g) || []).length, vg = (l.match(/,/g) || []).length, tb = (l.match(/\t/g) || []).length; return tb > pv && tb > vg ? '\t' : pv > vg ? ';' : ','; };

  const reT = /^(time|tempo|hora|hor[aá]rio|timestamp|date ?time|data ?hora|elapsed( time)?|seconds|segundos)( ?\(.*\))?$/i;
  let base = null;
  for (let i = 0; i < Math.min(linhas.length, 60); i++) {
    const sep = sepDe(linhas[i]);
    const cols = dividirCSV(linhas[i], sep);
    const iD = cols.findIndex(c => /^(date|data)$/i.test(c)), iS = cols.findIndex(c => /^(start time|hora de in[ií]cio|in[ií]cio)$/i.test(c));
    if (iD >= 0 && iS >= 0 && linhas[i + 1]) {
      const v = dividirCSV(linhas[i + 1], sep);
      const d = /(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/.exec(v[iD] || ''), h = /(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(v[iS] || '');
      if (d && h) base = new Date(+d[3], +d[2] - 1, +d[1], +h[1], +h[2], +(h[3] || 0)).getTime();
      continue;
    }
    const iF = cols.findIndex(c => reFC.test(c)), iT = cols.findIndex(c => reT.test(c));
    if (iF < 0 || iT < 0) continue;
    const brutos = [];
    for (let j = i + 1; j < linhas.length; j++) {
      if (!linhas[j].trim()) continue;
      const v = dividirCSV(linhas[j], sep);
      const fc = parseFloat(String(v[iF] || '').replace(',', '.'));
      const tt = String(v[iT] || '').trim();
      let ms = null, rel = null;
      if (/^\d{4}-\d\d-\d\d/.test(tt)) ms = Date.parse(tt.replace(' ', 'T'));
      else if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(tt)) { const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})\D+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(tt); if (m) ms = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +(m[6] || 0)).getTime(); }

      if (ms == null && rel == null) continue;
      brutos.push({ ms, rel, fc: isFinite(fc) ? fc : null });

  }

}

// ================= montagem e análise =================
const ESPORTES = { running: 'Corrida', run: 'Corrida', biking: 'Ciclismo', cycling: 'Ciclismo', bike: 'Ciclismo', walking: 'Caminhada', walk: 'Caminhada', hiking: 'Trilha', swimming: 'Natação', rowing: 'Remo', corrida: 'Corrida', ciclismo: 'Ciclismo', caminhada: 'Caminhada', 'natação': 'Natação' };
const tipoDoEsporte = e => e ? (ESPORTES[String(e).toLowerCase()] || (/^(other|generic|outro|training)$/i.test(e) ? null : (FIT_ESPORTES_NOMES.has(e) ? e : null))) : null;
const FIT_ESPORTES_NOMES = new Set(Object.values(FIT_ESPORTES));
const CANAIS = ['fc', 'alt', 'dist', 'vel', 'cad', 'pot', 'temp', 'lat', 'lon'];

function pesos(t) {
  const n = t.length, dts = [];
  for (let i = 0; i < n - 1; i++) dts.push(t[i + 1] - t[i]);
  const med = dts.length ? mediana(dts) : 1, lim = Math.max(30, med * 5);
  const w = new Array(n);
  let semReg = 0, nPausas = 0, maxDt = 0, minDt = Infinity;
  for (let i = 0; i < n - 1; i++) {
    const d = dts[i];
    if (d > maxDt) maxDt = d; if (d < minDt) minDt = d;
    if (d > lim) { w[i] = med; semReg += d - med; nPausas++; } else w[i] = d;
  }
  if (n) w[n - 1] = med;
  return { w, med, lim, maxDt, minDt: isFinite(minDt) ? minDt : med, semRegS: semReg, nPausas };
}

function resumir(series) {
  const { t, fc } = series, n = t.length;
  const P = pesos(t);
  let soma = 0, peso = 0, max = -Infinity, min = Infinity, tMax = 0;
  const h = new Map();
  for (let i = 0; i < n; i++) {
    const v = fc[i]; if (v == null) continue;
    soma += v * P.w[i]; peso += P.w[i];
    if (v > max) { max = v; tMax = t[i]; }
    if (v < min) min = v;
    h.set(v, (h.get(v) || 0) + P.w[i]);
  }
  let hist = null, fcMediana = null;
  if (peso) {
    const s = new Array(max - min + 1).fill(0);
    for (const [b, x] of h) s[b - min] = x;
    let acc = 0;
    for (let i = 0; i < s.length; i++) { acc += s[i]; if (acc >= peso / 2) { fcMediana = min + i; break; } }
    hist = { de: min, s: s.map(x => Math.round(x * 10) / 10) };
  }
  const canais = {};
  for (const k of ['fc', 'alt', 'dist', 'vel', 'cad', 'pot', 'temp']) {
    const a = series[k]; if (!a) continue;
    let c = 0, mn = Infinity, mx = -Infinity, sm = 0;
    for (const v of a) if (v != null) { c++; if (v < mn) mn = v; if (v > mx) mx = v; sm += v; }
    if (c) canais[k] = { n: c, min: mn, max: mx, media: sm / c };
  }
  if (series.alt) {
    const s = suavizar(t, series.alt, 30); let sobe = 0, desce = 0, ant = null;
    for (const v of s) { if (v == null) continue; if (ant != null) { const d = v - ant; if (d > 0) sobe += d; else desce -= d; } ant = v; }
    canais.alt.subida = sobe; canais.alt.descida = desce;
  }
  if (series.lat) canais.gps = { n: series.lat.filter(v => v != null).length };
  return {
    duracaoS: n ? t[n - 1] : 0, tempoFcS: Math.round(peso), fcMed: peso ? soma / peso : null, fcMax: peso ? max : null, fcMin: peso ? min : null,
    fcMediana, tFcMax: tMax, nRegistros: n, intervaloS: P.med, intervaloMinS: P.minDt, intervaloMaxS: P.maxDt, semRegistroS: P.semRegS, nPausas: P.nPausas, canais, hist
  };
}

function montarTreino(ativ, nomeArquivo) {
  const pts = ativ.pontos.filter(p => isFinite(p.ms)).sort((a, b) => a.ms - b.ms);
  if (pts.length < 2) throw new Error('o arquivo tem poucos registros para analisar');
  const t0 = pts[0].ms, t = [], c = {};
  CANAIS.forEach(k => { c[k] = []; });
  let ult = -1;
  for (const p of pts) {
    const s = Math.round((p.ms - t0) / 1000);
    if (s === ult) {
      const i = t.length - 1;
      for (const k of CANAIS) if (c[k][i] == null && p[k] != null && isFinite(p[k])) c[k][i] = p[k];
      continue;
    }
    t.push(s);
    for (const k of CANAIS) c[k].push(p[k] != null && isFinite(p[k]) ? p[k] : null);
    ult = s;
  }
  c.fc = c.fc.map(v => v != null && v >= 25 && v <= 250 ? Math.round(v) : null);
  if (!c.dist.some(v => v != null) && c.lat.some(v => v != null)) {
    let acc = 0, la0 = null, lo0 = null;
    c.dist = c.lat.map((la, i) => { const lo = c.lon[i]; if (la == null || lo == null) return null; if (la0 != null) acc += haversine(la0, lo0, la, lo); la0 = la; lo0 = lo; return acc; });
  }
  const R = { alt: 10, dist: 10, vel: 100, cad: 1, pot: 1, temp: 10, lat: 1e6, lon: 1e6 };
  const series = { t };
  for (const k of CANAIS) {
    if (!c[k].some(v => v != null)) continue;
    series[k] = k === 'fc' ? c[k] : c[k].map(v => v == null ? null : Math.round(v * R[k]) / R[k]);
  }
  if (!series.fc || series.fc.filter(v => v != null).length < 2) throw new Error('não encontrei registros de frequência cardíaca no arquivo');
  const resumo = resumir(series);
  const voltas = (ativ.voltas || []).map(v => ({ ...v, extras: v.extras || {} }));
  const soma = k => { const v = voltas.map(x => x[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
  const maxV = k => { const v = voltas.map(x => x[k]).filter(x => x != null); return v.length ? Math.max(...v) : null; };
  const tot = ativ.totais || {};
  const distSerie = series.dist ? (series.dist.filter(v => v != null).pop() - series.dist.find(v => v != null)) : null;
  const totais = {
    tempoS: tot.tempoS ?? soma('tempoS'), tempoAtivoS: tot.tempoAtivoS ?? null,
    distanciaM: tot.distanciaM ?? soma('distanciaM') ?? distSerie, calorias: tot.calorias ?? soma('calorias'),
    fcMed: tot.fcMed ?? (voltas.length === 1 ? voltas[0].fcMed : null), fcMax: tot.fcMax ?? maxV('fcMax'),
    velMed: tot.velMed ?? null, velMax: tot.velMax ?? maxV('velMax'), cadMed: tot.cadMed ?? null, potMed: tot.potMed ?? null,
    subidaM: tot.subidaM ?? null, descidaM: tot.descidaM ?? null
  };
  const fusoMin = ativ.fusoMin ?? fusoLocal(t0);
  const meta = {
    id: 't' + t0, v: 1, inicioMs: t0, fusoMin, formato: ativ.formato, arquivo: nomeArquivo || null,
    dispositivo: ativ.dispositivo || null, esporteArquivo: ativ.esporte || null, nomeArquivo: ativ.nome || null, notasArquivo: ativ.notas || null,
    dataAproximada: !!ativ.dataAproximada, tipo: tipoDoEsporte(ativ.esporte) || E.cfg.ultimoTipo || 'Treino',
    titulo: '', pse: null, rounds: null, notas: '', voltas, totais, resumo, importadoEm: new Date().toISOString()
  };
  return { meta: limpo(meta), series: limpo({ id: meta.id, ...series }) };
}

function suavizar(t, v, janela) {
  const n = t.length;
  if (!janela) return v.slice();
  const out = new Array(n), h = janela / 2;
  let a = 0, b = 0, soma = 0, cont = 0;
  for (let i = 0; i < n; i++) {
    while (b < n && t[b] <= t[i] + h) { if (v[b] != null) { soma += v[b]; cont++; } b++; }
    while (a < b && t[a] < t[i] - h) { if (v[a] != null) { soma -= v[a]; cont--; } a++; }
    out[i] = cont ? soma / cont : null;
  }
  return out;
}

function zonaDe(b, lim) { let z = 0; for (let i = 0; i < 5; i++) if (b >= lim[i]) z = i + 1; return z; }
function temposZona(hist, lim) {
  const z = [0, 0, 0, 0, 0, 0];
  if (!hist) return z;
  hist.s.forEach((s, i) => { z[zonaDe(hist.de + i, lim)] += s; });
  return z;
}
const cargaZonas = zt => zt.reduce((a, s, i) => a + s / 60 * i, 0);

function blocosEsforco(series, P, limiar) {
  const { t, fc } = series, n = t.length;
  const s20 = suavizar(t, fc, 20);
  const corr = [];
  let ini = null;
  for (let i = 0; i < n; i++) {
    const acima = s20[i] != null && s20[i] >= limiar;
    if (acima && ini == null) ini = i;
    if (!acima && ini != null) { corr.push([ini, i - 1]); ini = null; }
  }
  if (ini != null) corr.push([ini, n - 1]);
  const unidos = [];
  for (const r of corr) { const ant = unidos[unidos.length - 1]; if (ant && t[r[0]] - t[ant[1]] < 45) ant[1] = r[1]; else unidos.push(r.slice()); }
  const s10 = suavizar(t, fc, 10);
  return unidos.filter(([a, b]) => t[b] - t[a] >= 60).map(([a, b]) => {
    let soma = 0, peso = 0, max = -Infinity, iMax = a;
    for (let i = a; i <= b; i++) { const v = fc[i]; if (v == null) continue; soma += v * P.w[i]; peso += P.w[i]; if (v > max) { max = v; iMax = i; } }
    return { ini: t[a], fim: t[b], dur: t[b] - t[a], fcMed: peso ? soma / peso : null, fcMax: max, tMax: t[iMax], rec: quedaApos(series, iMax, s10) };
  });
}
function quedaApos(series, iPico, s10) {
  const { t, fc } = series, alvo = t[iPico] + 60;
  const j = primeiroMaiorIgual(t, alvo);
  if (j < 0 || t[j] - alvo > 15 || s10[j] == null) return null;
  return { de: fc[iPico], para: Math.round(s10[j]), queda: Math.round(fc[iPico] - s10[j]) };
}
function parciais(series, P, tam) {
  const { t, fc } = series, grupos = new Map();
  for (let i = 0; i < t.length; i++) {
    const v = fc[i]; if (v == null) continue;
    const k = Math.floor(t[i] / tam);
    let g = grupos.get(k); if (!g) grupos.set(k, g = { k, soma: 0, peso: 0, max: -Infinity, min: Infinity });
    g.soma += v * P.w[i]; g.peso += P.w[i]; if (v > g.max) g.max = v; if (v < g.min) g.min = v;
  }
  return [...grupos.values()].sort((a, b) => a.k - b.k).map(g => ({ ini: g.k * tam, fim: Math.min((g.k + 1) * tam, t[t.length - 1]), med: g.soma / g.peso, max: g.max, min: g.min }));
}
function mediaEntre(series, P, a, b) {
  let soma = 0, peso = 0;
  for (let i = 0; i < series.t.length; i++) { const x = series.t[i]; if (x < a || x >= b) continue; const v = series.fc[i]; if (v == null) continue; soma += v * P.w[i]; peso += P.w[i]; }
  return peso ? soma / peso : null;
}

function analisar(meta, series, Z) {
  const P = pesos(series.t);
  const zt = temposZona(meta.resumo.hist, Z.limites);
  const limiar = limiarEsforco(Z);
  const blocos = blocosEsforco(series, P, limiar);
  const s10 = suavizar(series.t, series.fc, 10);
  const iPico = series.t.indexOf(meta.resumo.tFcMax);
  const dur = meta.resumo.duracaoS;
  return {
    P, zt, totalZ: zt.reduce((a, b) => a + b, 0), carga: cargaZonas(zt), altaS: zt[4] + zt[5], limiar, blocos,
    recPico: iPico >= 0 ? quedaApos(series, iPico, s10) : null,
    metades: [mediaEntre(series, P, 0, dur / 2), mediaEntre(series, P, dur / 2, dur + 1)]
  };
}

let Armazem = null;
function armazemMemoria() {
  const t = new Map(), s = new Map(); let cfg = null;
  return {
    tipo: 'memoria', async listar() { return [...t.values()]; }, async serie(id) { return s.get(id) || null; },
    async salvar(m, se) { t.set(m.id, m); s.set(m.id, se); }, async atualizar(id, patch) { Object.assign(t.get(id), patch); },
    async excluir(id) { t.delete(id); s.delete(id); }, async config() { return cfg; }, async salvarConfig(c) { cfg = c; }
  };

function idbAbrir() {
  return new Promise((ok, erro) => {
    const r = indexedDB.open('pulso-do-treino', 1);
    r.onupgradeneeded = () => { const db = r.result; for (const n of ['treinos', 'series', 'config']) if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: 'id' }); };
    r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error); r.onblocked = () => erro(new Error('banco bloqueado'));
  });
}
function idbTx(db, lojas, modo, fn) {
  return new Promise((ok, erro) => {
    const tx = db.transaction(lojas, modo); let res;
    const rq = fn(tx); if (rq) rq.onsuccess = () => { res = rq.result; };
    tx.oncomplete = () => ok(res); tx.onerror = () => erro(tx.error); tx.onabort = () => erro(tx.error || new Error('operação cancelada'));
  });
}
async function armazemLocal() {
  const db = await idbAbrir();
  return {
    tipo: 'local',
    listar: () => idbTx(db, 'treinos', 'readonly', tx => tx.objectStore('treinos').getAll()),
    serie: id => idbTx(db, 'series', 'readonly', tx => tx.objectStore('series').get(id)),
    salvar: (m, s) => idbTx(db, ['treinos', 'series'], 'readwrite', tx => { tx.objectStore('series').put(s); tx.objectStore('treinos').put(m); }),
    async atualizar(id, patch) {
      await idbTx(db, 'treinos', 'readwrite', tx => { const st = tx.objectStore('treinos'); const g = st.get(id); g.onsuccess = () => { if (g.result) st.put({ ...g.result, ...patch }); }; });
    },
    excluir: id => idbTx(db, ['treinos', 'series'], 'readwrite', tx => { tx.objectStore('treinos').delete(id); tx.objectStore('series').delete(id); }),
    async config() { const r = await idbTx(db, 'config', 'readonly', tx => tx.objectStore('config').get('geral')); return r ? r.valor : null; },
    salvarConfig: c => idbTx(db, 'config', 'readwrite', tx => { tx.objectStore('config').put({ id: 'geral', valor: c }); })
  };
}
function caberNoDoc(s, limite = 230000) {
  if (JSON.stringify(s).length <= limite) return s;
  for (let k = 2; k <= 64; k *= 2) {
    const d = { id: s.id };
    for (const [ch, arr] of Object.entries(s)) if (Array.isArray(arr)) d[ch] = arr.filter((_, i) => i % k === 0 || i === arr.length - 1);
    if (JSON.stringify(d).length <= limite) return d;
  }
  throw new Error('o treino é longo demais para guardar');
}
function armazemNuvem(db) {
  const dado = snap => snap.exists ? limpo(snap.data()) : null;
  return {

    async serie(id) { return dado(await db.doc('series/' + id).get()); },
    async salvar(m, s) { await db.doc('series/' + m.id).set(caberNoDoc(limpo(s))); await db.doc('treinos/' + m.id).set(limpo(m)); },
    async atualizar(id, patch) { await db.doc('treinos/' + id).update(limpo(patch)); },
    async excluir(id) { await db.doc('treinos/' + id).delete(); await db.doc('series/' + id).delete(); },

  };
}

async function importarArquivos(lista) {
  const arquivos = [...lista]; if (!arquivos.length) return;
  if (E.carregando) { toast('Aguarde o histórico terminar de carregar.'); return; }
  let novos = 0, repetidos = 0, ultimo = null;
  const erros = [];
  for (const f of arquivos) {
    try {
      const buf = await f.arrayBuffer();
      const fmt = detectarFormato(buf);
      if (fmt === 'JSON') { const r = await importarBackup(new TextDecoder().decode(buf)); novos += r.novos; repetidos += r.repetidos; ultimo = r.ultimo || ultimo; continue; }
      if (fmt === 'XML') throw new Error('é um XML, mas não é TCX nem GPX');
      const txt = fmt === 'FIT' ? null : new TextDecoder('utf-8').decode(buf);
      const ativs = fmt === 'FIT' ? parseFIT(buf) : fmt === 'TCX' ? parseTCX(txt) : fmt === 'GPX' ? parseGPX(txt) : parseCSV(txt, f);
      for (const a of ativs) {

  const vals = s.filter(v => v != null); const mn = Math.min(...vals), mx = Math.max(...vals);

  for (let i = 0; i < n; i += passo) if (s[i] != null) pts.push(`${(series.t[i] / dur * 1000).toFixed(1)} ${(190 - (s[i] - mn) / ((mx - mn) || 1) * 170).toFixed(1)}`);
  const d = 'M' + pts.join('L');
  return `<svg class="heroi-curva" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L1000 200L0 200Z" style="fill:var(--accent);fill-opacity:.14"/><path d="${d}" style="fill:none;stroke:var(--accent);stroke-opacity:.7;stroke-width:2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function destaquesTreino(meta, an) {
  const r = meta.resumo, out = [];
  const [m1, m2] = an.metades;
  if (m1 != null && m2 != null && Math.abs(m2 - m1) >= 8) out.push(`${m2 > m1 ? 'A segunda metade foi mais intensa' : 'A primeira metade foi mais intensa'}: FC média de ${fmtN(Math.max(m1, m2))} bpm, contra ${fmtN(Math.min(m1, m2))} bpm na ${m2 > m1 ? 'primeira' : 'segunda'}.`);
  else if (m1 != null && m2 != null) out.push(`Intensidade parecida nas duas metades do treino: FC média de ${fmtN(m1)} e ${fmtN(m2)} bpm.`);
  if (an.blocos.length) {
    const tot = an.blocos.reduce((a, b) => a + b.dur, 0), top = an.blocos.reduce((a, b) => (b.fcMed > a.fcMed ? b : a));
    const i = an.blocos.indexOf(top);
    out.push(`${an.blocos.length} ${an.blocos.length === 1 ? 'bloco' : 'blocos'} de esforço acima de ${fmtN(an.limiar)} bpm, somando ${fmtDur(tot)}. O mais intenso foi o ${ordinal(i)}, de ${fmtN(top.ini / 60)} a ${fmtN(top.fim / 60)} min, com média de ${fmtN(top.fcMed)} bpm.`);
  }
  if (an.recPico) out.push(`Pico de ${r.fcMax} bpm aos ${fmtN(r.tFcMax / 60)} min. Um minuto depois a FC estava em ${an.recPico.para} bpm (queda de ${an.recPico.queda} bpm).`);
  out.push(`${fmtMin(an.altaS)} (${fmtPct(an.altaS / (an.totalZ || 1))}) em Z4 ou Z5, as zonas mais intensas.`);
  return out;
}

function desenharMapa(el, series) {
  montar(el, () => {
    const W = Math.max(240, el.clientWidth || 400), H = Math.round(W * 0.7); el._w = el.clientWidth;
    const la = series.lat, lo = series.lon, pts = [];
    for (let i = 0; i < la.length; i++) if (la[i] != null && lo[i] != null) pts.push([lo[i], la[i]]);
    if (pts.length < 2) { el.innerHTML = '<p class="nota">Sem pontos de GPS suficientes.</p>'; return; }
    const lats = pts.map(p => p[1]), lons = pts.map(p => p[0]);
    const k = Math.cos((Math.min(...lats) + Math.max(...lats)) / 2 * Math.PI / 180);
    const x0 = Math.min(...lons), x1 = Math.max(...lons), y0 = Math.min(...lats), y1 = Math.max(...lats);
    const sx = (x1 - x0) * k || 1e-6, sy = (y1 - y0) || 1e-6, esc_ = Math.min((W - 24) / sx, (H - 24) / sy);
    const ox = (W - sx * esc_) / 2, oy = (H - sy * esc_) / 2;
    const P = ([x, y]) => [ox + (x - x0) * k * esc_, H - oy - (y - y0) * esc_];
    const d = pts.map((p, i) => (i ? 'L' : 'M') + P(p).map(v => v.toFixed(1)).join(' ')).join('');
    const [ax, ay] = P(pts[0]), [bx, by] = P(pts[pts.length - 1]);
    el.innerHTML = `<svg class="svg-graf" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Percurso registrado pelo GPS"><rect width="${W}" height="${H}" rx="12" style="fill:var(--surface-2)"/><path d="${d}" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/><circle cx="${ax}" cy="${ay}" r="5" style="fill:var(--good);stroke:var(--surface);stroke-width:2"/><circle cx="${bx}" cy="${by}" r="5" style="fill:var(--ink);stroke:var(--surface);stroke-width:2"/></svg><p class="nota">Ponto verde: início · ponto escuro: fim.</p>`;
  });
}

  const Z = zonasAtuais();
  const escolha = `<section class="card"><div class="card-topo"><div><p class="sobretitulo">Escolha</p><h2>Treinos para comparar</h2></div><span class="nota">${E.cmp.length} de até ${MAX_CMP}</span></div>
    <div class="escolha">${E.treinos.map(t => { const on = E.cmp.includes(t.id); return `<label><input type="checkbox" data-cmp="${esc(t.id)}" ${on ? 'checked' : ''}><i ${on ? `style="background:${CORES_CMP[E.corCmp.get(t.id)]};border:0"` : ''}></i><span>${esc(t.tipo)}${t.titulo ? ` · ${esc(t.titulo)}` : ''}</span><small>${esc(fmtData(t.inicioMs, t.fusoMin))}<br>${esc(fmtDur(t.resumo.duracaoS))} · média ${fmtN(t.resumo.fcMed)}</small></label>`; }).join('')}</div></section>`;
  const sel = E.cmp.map(id => E.treinos.find(t => t.id === id)).filter(Boolean);
  if (sel.length < 2) {
    raiz.innerHTML = escolha + `<section class="card vazio"><h2>Marque pelo menos 2 treinos</h2><p class="texto">A comparação mostra as curvas de FC sobrepostas, o tempo em cada zona e uma tabela com as métricas lado a lado.</p></section>`;
    ligarEscolha(raiz); return;
  }
  raiz.innerHTML = escolha + '<section class="card"><p class="nota">Carregando os registros…</p></section>';
  ligarEscolha(raiz);
  const series = await Promise.all(sel.map(t => obterSerie(t.id).catch(() => null)));
  if (E.aba !== 'comparar' || tok !== E.tok) return;
  const itens = sel.map((t, i) => {
    const s = series[i], zt = temposZona(t.resumo.hist, Z.limites), total = zt.reduce((a, b) => a + b, 0);
    const an = s ? analisar(t, s, Z) : null;
    return { t, s, zt, total, an, cor: CORES_CMP[E.corCmp.get(t.id)], rot: `${fmtDataCurta(t.inicioMs, t.fusoMin)} · ${t.tipo}` };
  });
  const legenda = `<div class="legenda">${itens.map(it => `<span><i class="lk" style="background:${it.cor}"></i>${esc(it.rot)}</span>`).join('')}</div>`;
  const durMax = Math.max(...itens.map(it => it.t.resumo.duracaoS)) / 60;
  const linhaM = (rot, f, dif, fmt = v => fmtN(v)) => {
    const vals = itens.map(f), base = vals[0];
    return `<tr><td>${esc(rot)}</td>${vals.map((v, i) => `<td class="num">${v == null ? '–' : esc(fmt(v))}${dif && i > 0 && v != null && base != null && Math.round(v - base) !== 0 ? `<span class="dif">${v > base ? '+' : '−'}${esc(fmt(Math.abs(v - base)))}</span>` : ''}</td>`).join('')}</tr>`;
  };
  const tabela = `<div class="rolagem"><table class="tabela"><thead><tr><th>Métrica</th>${itens.map(it => `<th class="num"><span class="sw" style="background:${it.cor}"></span>${esc(it.rot)}</th>`).join('')}</tr></thead><tbody>
    ${linhaM('Horário', it => `${fmtHora(it.t.inicioMs, it.t.fusoMin)}`, false, v => v)}
    ${linhaM('Duração (min)', it => it.t.resumo.duracaoS / 60, true)}
    ${linhaM('Gasto estimado (kcal)', it => it.t.totais?.calorias ?? null, true)}
    ${linhaM('FC média (bpm)', it => it.t.resumo.fcMed, true)}
    ${linhaM('FC mediana (bpm)', it => it.t.resumo.fcMediana, true)}
    ${linhaM('FC máxima (bpm)', it => it.t.resumo.fcMax, true)}
    ${linhaM('FC mínima (bpm)', it => it.t.resumo.fcMin, true)}
    ${linhaM('FC média em % da FC máx.', it => it.t.resumo.fcMed / Z.fcmax * 100, true, v => fmtN(v) + '%')}
    ${[1, 2, 3, 4, 5].map(z => linhaM(`Z${z} · ${NOMES_ZONA[z]} (min)`, it => it.zt[z] / 60, true, v => fmtN(v, 1))).join('')}
    ${linhaM('Z4 + Z5 (min)', it => (it.zt[4] + it.zt[5]) / 60, true, v => fmtN(v, 1))}
    ${linhaM('Carga por zonas', it => cargaZonas(it.zt), true)}
    ${linhaM('Blocos de esforço', it => it.an ? it.an.blocos.length : null, true)}
    ${linhaM('Tempo em blocos (min)', it => it.an ? it.an.blocos.reduce((a, b) => a + b.dur, 0) / 60 : null, true, v => fmtN(v, 1))}
    ${linhaM('Queda da FC 1 min após o pico (bpm)', it => it.an?.recPico?.queda ?? null, true)}
    ${linhaM('PSE (0–10)', it => it.t.pse, true)}
    ${linhaM('Carga pela PSE (UA)', it => it.t.pse != null ? it.t.pse * it.t.resumo.duracaoS / 60 : null, true)}
    ${linhaM('Rounds', it => it.t.rounds, true)}
    </tbody></table></div><p class="nota">Abaixo de cada valor, a diferença em relação ao primeiro treino da lista.</p>`;
  const pilhas = linhasPilhas(itens.map(it => ({ id: it.t.id, rotulo: it.t.tipo, sub: fmtData(it.t.inicioMs, it.t.fusoMin), zt: it.zt, total: it.total, alta: it.zt[4] + it.zt[5], cor: it.cor })), E.modoCmp);
  raiz.innerHTML = escolha + `
    <section class="card"><div class="card-topo"><div><p class="sobretitulo">Frequência cardíaca</p><h2>Curvas sobrepostas</h2></div>${legenda}</div><div class="graf" id="g-cmp"></div><p class="nota">Média de 30 s, contando o tempo desde o início de cada treino.</p></section>
    <section class="card"><div class="card-topo"><div><p class="sobretitulo">Intensidade</p><h2>Tempo em cada zona</h2></div>
      <div class="alternar" role="group" aria-label="Unidade"><button data-modo-cmp="min" aria-pressed="${E.modoCmp === 'min'}">Minutos</button><button data-modo-cmp="pct" aria-pressed="${E.modoCmp === 'pct'}">%</button></div></div>
      ${legendaZonas(Z)}${pilhas}</section>
    <section class="card"><div class="card-topo"><div><p class="sobretitulo">Lado a lado</p><h2>Métricas</h2></div></div>${tabela}</section>`;
  ligarEscolha(raiz);
  const comS = itens.filter(it => it.s);
  graficoLinha($('#g-cmp'), {
    rotulo: 'Frequência cardíaca dos treinos selecionados, sobrepostas desde o início', xMin: 0, xMax: durMax, yPad: 4, toleranciaX: 1.5,
    series: comS.map(it => ({ nome: it.rot, cor: it.cor, x: it.s.t.map(v => v / 60), y: suavizar(it.s.t, it.s.fc, 30) })),
    xTicks: pw => ticksMinutos(durMax, pw), dica: (x, ls) => ({ titulo: `${fmtRelogio(x * 60)} do treino`, linhas: ls.map(l => ({ cor: l.cor, valor: `${fmtN(l.y)} bpm`, nome: l.nome })) })
  });
  $$('[data-modo-cmp]', raiz).forEach(b => b.addEventListener('click', () => { E.modoCmp = b.dataset.modoCmp; renderComparar(); }));
}
function ligarEscolha(raiz) {
  $$('.escolha [data-cmp]', raiz).forEach(c => c.addEventListener('change', () => { alternarCmp(c.dataset.cmp, c.checked); renderComparar(); }));
}

// ----- zonas -----
function renderZonas() {
  const raiz = $('#aba-zonas'), c = E.cfg, Z = zonasAtuais(), obs = fcMaxObservada();
  const metodo = c.metodo === 'manual' ? 'manual' : c.metodo === 'reserva' ? 'reserva' : 'fcmax';
  const info = Z.origem === 'definida' ? `Usando FC máxima de ${Z.fcmax} bpm, informada por você.` : Z.origem === 'idade' ? `Usando FC máxima de ${Z.fcmax} bpm, estimada pela idade (208 − 0,7 × ${c.idade}).` : `Usando ${Z.fcmax} bpm, a maior FC registrada nos seus treinos. É um valor provisório: informe sua FC máxima ou sua idade.`;
  raiz.innerHTML = `<section class="card"><div class="card-topo"><div><p class="sobretitulo">Suas zonas</p><h2>Zonas de frequência cardíaca</h2></div><span class="nota" id="z-status"></span></div>
    <p class="texto">As zonas valem para todos os treinos do histórico: ao mudar aqui, o tempo em cada zona, a carga e as comparações são recalculados.</p>
    <div class="form-grade">
      <label class="campo"><span>Idade</span><input type="number" id="z-idade" min="10" max="100" inputmode="numeric" value="${c.idade ?? ''}" placeholder="anos"></label>
      <label class="campo"><span>FC máxima (bpm)</span><input type="number" id="z-fcmax" min="120" max="230" inputmode="numeric" value="${c.fcmax ?? ''}" placeholder="${Z.fcmax}"></label>
      <label class="campo"><span>FC de repouso (bpm)</span><input type="number" id="z-fcrep" min="30" max="110" inputmode="numeric" value="${c.fcrep ?? ''}" placeholder="opcional"></label>
    </div>
    <p class="nota" id="z-info">${esc(info)}</p>
    ${obs ? `<div class="botoes"><button class="btn btn-sm" id="z-obs">Usar a maior FC registrada (${obs} bpm)</button></div>` : ''}
    <fieldset class="metodo"><legend>Como calcular as zonas</legend>
      <label><input type="radio" name="z-met" value="fcmax" ${metodo === 'fcmax' ? 'checked' : ''}>% da FC máxima</label>
      <label><input type="radio" name="z-met" value="reserva" ${metodo === 'reserva' ? 'checked' : ''}>% da FC de reserva (Karvonen)</label>
      <label><input type="radio" name="z-met" value="manual" ${metodo === 'manual' ? 'checked' : ''}>Limites em bpm, definidos por mim</label></fieldset>
    ${metodo === 'reserva' && !c.fcrep ? '<p class="aviso">Para usar a FC de reserva, informe sua FC de repouso. Enquanto isso, as zonas usam % da FC máxima.</p>' : ''}
    <div class="rolagem"><table class="tabela tz"><thead><tr><th>Zona</th><th>${metodo === 'manual' ? 'Começa em (bpm)' : 'Começa em (%)'}</th><th>Faixa</th></tr></thead><tbody>
      ${[1, 2, 3, 4, 5].map(z => `<tr><td><span class="sw-z" style="background:${corZona(z)}"></span>Z${z} · ${NOMES_ZONA[z]}</td>
        <td>${metodo === 'manual' ? `<input type="number" data-lim="${z - 1}" min="40" max="230" value="${Z.limites[z - 1]}" aria-label="Início da Z${z} em bpm">` : `<input type="number" data-pct="${z - 1}" min="30" max="100" value="${Z.pcts[z - 1]}" aria-label="Início da Z${z} em %">`}</td>
        <td data-faixa="${z}">${esc(faixaZona(z, Z.limites))}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="botoes"><button class="btn btn-sm" id="z-padrao">Voltar ao padrão (50, 60, 70, 80 e 90%)</button></div></section>
    <section class="card"><div class="card-topo"><div><p class="sobretitulo">Seus dados</p><h2>Backup do histórico</h2></div></div>
      <p class="texto">${Armazem?.tipo === 'nuvem' ? 'Os treinos estão guardados neste app, na sua conta do Claude, e aparecem em qualquer aparelho em que você abrir este link.' : Armazem?.tipo === 'local' ? 'Os treinos estão guardados neste navegador. Se você limpar os dados do navegador ou trocar de aparelho, eles somem: exporte um backup de vez em quando.' : 'Este navegador não permite guardar dados. Os treinos ficam só até fechar a página: exporte um backup.'}</p>
      <p class="texto">O backup é um arquivo .json com todos os treinos e as zonas. Para restaurar, use o botão Importar treino e escolha o arquivo do backup.</p>
      <div class="botoes"><button class="btn" id="b-exportar">Exportar backup (.json)</button><label class="btn" for="arquivo">Importar backup</label></div>
      <div class="confirmar" id="b-apagar-area">${E.treinos.length ? (E.confirmarApagar ? `<span>Apagar os ${E.treinos.length} treinos do histórico? Isso não pode ser desfeito.</span><button class="btn btn-perigo-cheio btn-sm" id="b-apagar-sim">Apagar tudo</button><button class="btn btn-sm" id="b-apagar-nao">Cancelar</button>` : '<button class="btn btn-perigo btn-sm" id="b-apagar">Apagar todos os treinos</button>') : ''}</div></section>
    <section class="card"><div class="card-topo"><div><p class="sobretitulo">De onde vêm os cálculos</p><h2>Referências</h2></div></div>
      <ul class="refs">
        <li>FC máxima pela idade (208 − 0,7 × idade): Tanaka H, Monahan KD, Seals DR. Age-predicted maximal heart rate revisited. J Am Coll Cardiol. 2001;37(1):153-6.</li>
        <li>Zonas pela FC de reserva: Karvonen MJ, Kentala E, Mustala O. The effects of training on heart rate; a longitudinal study. Ann Med Exp Biol Fenn. 1957;35(3):307-15.</li>
        <li>Carga pela PSE da sessão: Foster C, Florhaug JA, Franklin J, et al. A new approach to monitoring exercise training. J Strength Cond Res. 2001;15(1):109-15.</li>
        <li>Precisão de sensores de pulso: Wang R, Blackburn G, Desai M, et al. Accuracy of wrist-worn heart rate monitors. JAMA Cardiol. 2017;2(1):104-6.</li>
      </ul>
      <p class="nota">A estimativa pela idade tem margem de erro de vários bpm para cada pessoa; um teste de esforço dá o valor real. A carga por zonas soma os minutos de cada zona multiplicados pelo número da zona.</p></section>`;
  const st = () => { const s = $('#z-status'); if (s) s.textContent = 'Salvo'; };
  const reaplicar = () => {
    const Zn = zonasAtuais();
    $$('[data-faixa]', raiz).forEach(td => { td.textContent = faixaZona(+td.dataset.faixa, Zn.limites); });
    $('#z-info').textContent = Zn.origem === 'definida' ? `Usando FC máxima de ${Zn.fcmax} bpm, informada por você.` : Zn.origem === 'idade' ? `Usando FC máxima de ${Zn.fcmax} bpm, estimada pela idade (208 − 0,7 × ${E.cfg.idade}).` : `Usando ${Zn.fcmax} bpm, a maior FC registrada nos seus treinos. É um valor provisório: informe sua FC máxima ou sua idade.`;
    salvarConfig(); st();
  };
  const num = (el, a, b) => { const v = el.value === '' ? null : Math.round(+el.value); return v != null && v >= a && v <= b ? v : null; };
  $('#z-idade').addEventListener('input', e => { E.cfg.idade = num(e.target, 10, 100); reaplicar(); });
  $('#z-fcmax').addEventListener('input', e => { E.cfg.fcmax = num(e.target, 120, 230); reaplicar(); });
  $('#z-fcrep').addEventListener('input', e => { E.cfg.fcrep = num(e.target, 30, 110); reaplicar(); });
  const obsB = $('#z-obs'); if (obsB) obsB.addEventListener('click', () => { E.cfg.fcmax = obs; salvarConfig(); renderZonas(); st(); });
  $$('[name="z-met"]', raiz).forEach(r => r.addEventListener('change', () => {
    if (r.value === 'manual' && !(Array.isArray(E.cfg.limites) && E.cfg.limites.length === 5)) E.cfg.limites = zonasAtuais().limites;
    E.cfg.metodo = r.value; salvarConfig(); renderZonas(); st();
  }));
  $$('[data-pct]', raiz).forEach(inp => inp.addEventListener('input', () => { const v = num(inp, 30, 100); if (v == null) return; E.cfg.pcts = (E.cfg.pcts || PCTS_PADRAO).slice(); E.cfg.pcts[+inp.dataset.pct] = v; reaplicar(); }));
  $$('[data-lim]', raiz).forEach(inp => inp.addEventListener('input', () => { const v = num(inp, 40, 230); if (v == null) return; E.cfg.limites = (E.cfg.limites || zonasAtuais().limites).slice(); E.cfg.limites[+inp.dataset.lim] = v; reaplicar(); }));
  $('#z-padrao').addEventListener('click', () => { E.cfg.pcts = PCTS_PADRAO.slice(); E.cfg.limites = null; if (E.cfg.metodo === 'manual') E.cfg.metodo = 'fcmax'; salvarConfig(); renderZonas(); st(); });
  $('#b-exportar').addEventListener('click', exportarBackup);
  const ap = $('#b-apagar'); if (ap) ap.addEventListener('click', () => { E.confirmarApagar = true; renderZonas(); });
  const apN = $('#b-apagar-nao'); if (apN) apN.addEventListener('click', () => { E.confirmarApagar = false; renderZonas(); });
  const apS = $('#b-apagar-sim'); if (apS) apS.addEventListener('click', async () => {
    try { for (const t of E.treinos.slice()) { await Armazem.excluir(t.id); E.treinos = E.treinos.filter(x => x.id !== t.id); } } catch (e) { toast('Parte dos treinos não foi apagada: ' + (e.message || e.code || 'erro')); }
    E.series.clear(); E.cmp = []; E.corCmp.clear(); E.atual = null; E.confirmarApagar = false;
    toast('Histórico apagado.'); renderZonas(); atualizarSelo();
  });
}

// ================= navegação e eventos =================
function mostrarAba(aba) {
  E.aba = aba;
  $$('.aba').forEach(b => b.setAttribute('aria-selected', String(b.dataset.aba === aba)));
  for (const n of ['treino', 'historico', 'comparar', 'zonas']) $('#aba-' + n).hidden = n !== aba;
  if (E.carregando) return;
  ({ treino: renderTreino, historico: renderHistorico, comparar: renderComparar, zonas: renderZonas })[aba]();
}
function atualizarSelo() {
  const s = $('#selo'), n = E.treinos.length, tipo = Armazem?.tipo || 'carregando';
  s.dataset.tipo = tipo;
  const qtd = n ? `${n} ${n === 1 ? 'treino' : 'treinos'}` : 'nenhum treino';
  s.textContent = tipo === 'nuvem' ? `${qtd} · salvo na sua conta` : tipo === 'local' ? `${qtd} · salvo neste navegador` : `${qtd} · não está sendo salvo`;
}
let toastId;
function toast(msg, ms = 4500) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastId); toastId = setTimeout(() => { t.hidden = true; }, ms); }

function ligarEventos() {
  $$('.aba').forEach(b => b.addEventListener('click', () => mostrarAba(b.dataset.aba)));
  $('.abas').addEventListener('keydown', ev => {
    if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
    const abas = $$('.aba'), i = abas.findIndex(b => b.dataset.aba === E.aba), j = (i + (ev.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
    abas[j].focus(); mostrarAba(abas[j].dataset.aba);
  });
  $('#arquivo').addEventListener('change', e => { const f = e.target.files; importarArquivos(f).finally(() => { e.target.value = ''; }); });
  document.addEventListener('click', ev => {
    const ir = ev.target.closest('[data-ir]'); if (ir) { mostrarAba(ir.dataset.ir); return; }
    const ab = ev.target.closest('[data-abrir]'); if (ab) abrirTreino(ab.dataset.abrir);
  });
  // arrastar e soltar
  const soltar = $('#soltar'); let prof = 0;
  const temArquivo = ev => [...(ev.dataTransfer?.types || [])].includes('Files');
  window.addEventListener('dragenter', ev => { if (!temArquivo(ev)) return; ev.preventDefault(); prof++; soltar.hidden = false; });
  window.addEventListener('dragover', ev => { if (temArquivo(ev)) ev.preventDefault(); });
  window.addEventListener('dragleave', () => { prof = Math.max(0, prof - 1); if (!prof) soltar.hidden = true; });
  window.addEventListener('drop', ev => { if (!temArquivo(ev)) return; ev.preventDefault(); prof = 0; soltar.hidden = true; importarArquivos(ev.dataTransfer.files); });
  // dica das barras empilhadas
  const dica = $('#dica');
  const posicionar = ev => { const w = dica.offsetWidth, h = dica.offsetHeight; let x = ev.clientX + 14, y = ev.clientY + 14; if (x + w > innerWidth - 8) x = ev.clientX - 14 - w; if (y + h > innerHeight - 8) y = ev.clientY - 14 - h; dica.style.left = Math.max(8, x) + 'px'; dica.style.top = Math.max(8, y) + 'px'; };
  document.addEventListener('pointerover', ev => { const el = ev.target.closest?.('[data-dica]'); if (!el) return; dica.textContent = el.dataset.dica; dica.hidden = false; posicionar(ev); });
  document.addEventListener('pointermove', ev => { if (!dica.hidden && ev.target.closest?.('[data-dica]')) posicionar(ev); });
  document.addEventListener('pointerout', ev => { if (ev.target.closest?.('[data-dica]')) dica.hidden = true; });
  window.addEventListener('scroll', () => { dica.hidden = true; }, { passive: true });
}

async function iniciar() {
  ligarEventos();
  const h = (location.hash || '').slice(1);
  if (['historico', 'comparar', 'zonas'].includes(h)) mostrarAba(h);
  try {
    Armazem = await escolherArmazem();
    const cfg = await Armazem.config().catch(() => null);
    E.cfg = { ...CONFIG_PADRAO, ...(cfg || {}) };
    E.treinos = (await Armazem.listar()).filter(t => t && t.id && t.resumo);
  } catch (e) {
    Armazem = armazemMemoria();
    toast('Não consegui abrir o histórico salvo. Os treinos importados agora não serão guardados.', 8000);
  }
  ordenar();
  E.atual = E.treinos[0]?.id || null;
  E.carregando = false;
  atualizarSelo();
  mostrarAba(E.aba);
}
iniciar();
})();
</script>
</body>
</html>
