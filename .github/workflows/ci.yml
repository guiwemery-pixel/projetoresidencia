name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: estudos
          POSTGRES_PASSWORD: estudos
          POSTGRES_DB: estudos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U estudos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://estudos:estudos@localhost:5432/estudos_test?schema=public
      TEST_DATABASE_URL: postgresql://estudos:estudos@localhost:5432/estudos_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
