name: Site do Pulso do Treino

# Publica a pasta treinos/ no GitHub Pages sempre que ela muda no branch principal.
# Endereço: https://<usuário>.github.io/<repositório>/treinos/
on:
  push:
    paths:
      - 'treinos/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}treinos/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Montar o site
        run: |
          mkdir -p _site/treinos
          cp -r treinos/. _site/treinos/
          rm -f _site/treinos/README.md
          printf '%s\n' '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Pulso do Treino</title><meta http-equiv="refresh" content="0; url=treinos/"><a href="treinos/">Abrir o Pulso do Treino</a></html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
