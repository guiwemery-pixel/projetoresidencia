# Uso:
#   docker compose up -d db          → só o PostgreSQL (desenvolvimento local)
#   docker compose up -d --build     → aplicação completa em http://localhost:3333
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estudos
      POSTGRES_PASSWORD: estudos
      POSTGRES_DB: estudos
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estudos']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://estudos:estudos@db:5432/estudos?schema=public
      NODE_ENV: production
      PORT: 3333
      CORS_ORIGIN: http://localhost:3333
      # Em produção atrás de HTTPS, remova a linha abaixo (o padrão é "true")
      COOKIE_SECURE: 'false'
    ports:
      - '3333:3333'

volumes:
  pgdata:
